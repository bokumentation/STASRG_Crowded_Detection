<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Konfigurasi Sistem - Deteksi Kerumunan</title>
    <link href="{{ url_for('static', filename='css/tailwind.min.css') }}" rel="stylesheet">
</head>

<body class="bg-gray-50 min-h-screen">
    <header class="bg-white shadow-md mb-4">
        <div class="container mx-auto flex justify-between items-center p-4">
            <div class="flex items-center">
                <img id="logo" src="{{ url_for('static', filename='stas.png') }}" alt="Crowded Detection Logo"
                    class="h-10 mr-3 transition-opacity duration-300">
            </div>
            <nav>
                <div class="ml-10 flex items-baseline space-x-4">

                    <a href="/"
                        class="rounded-xl px-3 py-2 text-sm font-medium text-gray-500 hover:bg-gray-100 hover:text-gray-900">
                        Kembali
                    </a>

                    <a href="/petunjuk"
                        class="rounded-xl px-3 py-2 text-sm font-medium text-gray-500 hover:bg-gray-100 hover:text-gray-900">
                        Petunjuk
                    </a>

                    <a href="/konfigurasi"
                        class="rounded-xl px-3 py-2 text-sm font-medium text-gray-500 hover:bg-gray-100 hover:text-gray-900">
                        Konfigurasi
                    </a>

                    <a href="/tentang"
                        class="rounded-xl px-3 py-2 text-sm font-medium text-gray-500 hover:bg-gray-100 hover:text-gray-900">
                        Tentang
                    </a>
                </div>
            </nav>
        </div>
    </header>


    <div class="bg-white shadow-lg rounded-lg p-8">
        <h2 class="text-3xl font-bold text-gray-800 mb-6 border-b pb-2">Pengaturan Konfigurasi Real-time</h2>

        <div id="status-message" class="hidden p-3 mb-4 text-sm text-green-700 bg-green-100 rounded-lg">
            Konfigurasi berhasil diperbarui! Restart aplikasi untuk menerapkan semua perubahan.
        </div>

        <form id="config-form" class="space-y-6" onsubmit="saveConfig(event)">

            <h3 class="text-xl font-semibold text-blue-600 border-b pb-1">Mode & Resolusi</h3>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div>
                    <label for="version" class="block text-sm font-medium text-gray-700">Versi Aktif</label>
                    <select id="version" name="version"
                        class="mt-1 block w-full pl-3 pr-10 py-2 text-base border-gray-300 focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm rounded-md">
                        <option value="horizontal">Horizontal (Gerak Vertikal)</option>
                        <option value="vertical">Vertical (Gerak Horizontal)</option>
                    </select>
                </div>
                <div>
                    <label for="max_crowd_count" class="block text-sm font-medium text-gray-700">Batas Maksimum
                        Kerumunan</label>
                    <input type="number" id="max_crowd_count" name="max_crowd_count" min="1" required
                        class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm">
                </div>
                <div>
                    <label for="resize_width" class="block text-sm font-medium text-gray-700">Resolusi Lebar
                        (px)</label>
                    <input type="number" id="resize_width" name="resize_width" min="100" required
                        class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm">
                </div>
                <div>
                    <label for="max_disappeared" class="block text-sm font-medium text-gray-700">Toleransi Pelacakan
                        (max_disappeared)</label>
                    <input type="number" id="max_disappeared" name="max_disappeared" min="1" required
                        class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm">
                </div>
            </div>

            <h3 class="text-xl font-semibold text-blue-600 border-b pb-1 mt-6">Pengaturan Garis Horizontal (Gerak
                Vertikal)</h3>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div>
                    <label for="h_entry" class="block text-sm font-medium text-gray-700">Posisi Garis Masuk
                        (Y-axis)</label>
                    <input type="number" id="h_entry" name="h_entry" min="0" required
                        class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm">
                </div>
                <div>
                    <label for="h_exit" class="block text-sm font-medium text-gray-700">Posisi Garis Keluar
                        (Y-axis)</label>
                    <input type="number" id="h_exit" name="h_exit" min="0" required
                        class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm">
                </div>
            </div>

            <h3 class="text-xl font-semibold text-blue-600 border-b pb-1 mt-6">Pengaturan Garis Vertikal (Gerak
                Horizontal)</h3>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div>
                    <label for="v_entry" class="block text-sm font-medium text-gray-700">Posisi Garis Masuk
                        (X-axis)</label>
                    <input type="number" id="v_entry" name="v_entry" min="0" required
                        class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm">
                </div>
                <div>
                    <label for="v_exit" class="block text-sm font-medium text-gray-700">Posisi Garis Keluar
                        (X-axis)</label>
                    <input type="number" id="v_exit" name="v_exit" min="0" required
                        class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm">
                </div>
            </div>

            <h3 class="text-xl font-semibold text-blue-600 border-b pb-1 mt-6">Hitungan Awal</h3>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div>
                    <label for="initial_entry" class="block text-sm font-medium text-gray-700">Hitungan Masuk
                        Awal</label>
                    <input type="number" id="initial_entry" name="initial_entry" min="0" required
                        class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm">
                </div>
                <div>
                    <label for="initial_exit" class="block text-sm font-medium text-gray-700">Hitungan Keluar
                        Awal</label>
                    <input type="number" id="initial_exit" name="initial_exit" min="0" required
                        class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm">
                </div>
            </div>

            <div class="pt-5">
                <button type="submit"
                    class="w-full justify-center py-3 px-4 border border-transparent shadow-sm text-sm font-medium rounded-md text-white bg-indigo-600 hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500 transition duration-150">
                    Simpan Perubahan & Perlu Restart
                </button>
            </div>
        </form>

        <button onclick="sendShutdown()"
            class="mt-4 w-full justify-center py-3 px-4 border border-transparent shadow-sm text-sm font-medium rounded-md text-white bg-red-600 hover:bg-red-700 transition duration-150">
            Matikan Aplikasi
        </button>
    </div>


    <script>
        document.addEventListener('DOMContentLoaded', fetchConfigAndPopulate);

        const STATUS_MSG = document.getElementById('status-message');

        // --- Fungsi 1: Ambil data konfigurasi dan isi formulir ---
        async function fetchConfigAndPopulate() {
            try {
                const response = await fetch('/api/config'); // Menggunakan rute baru
                if (!response.ok) throw new Error('Gagal mengambil konfigurasi.');

                const config = await response.json();

                // Isi field form dengan nilai dari config.json
                document.getElementById('version').value = config.version || 'horizontal';
                document.getElementById('max_crowd_count').value = config.capacity.max_crowd_count || 150;
                document.getElementById('resize_width').value = config.resize.width || 640;
                document.getElementById('max_disappeared').value = config.tracking.max_disappeared || 50;

                document.getElementById('h_entry').value = config.horizontal_lines.entry_line_position || 200;
                document.getElementById('h_exit').value = config.horizontal_lines.exit_line_position || 280;

                document.getElementById('v_entry').value = config.vertical_lines.entry_line_position || 280;
                document.getElementById('v_exit').value = config.vertical_lines.exit_line_position || 360;

                document.getElementById('initial_entry').value = config.initial_counts.entry || 0;
                document.getElementById('initial_exit').value = config.initial_counts.exit || 0;

            } catch (error) {
                console.error('Error fetching config:', error);
                STATUS_MSG.textContent = 'Gagal memuat konfigurasi. Pastikan aplikasi berjalan.';
                STATUS_MSG.classList.remove('hidden', 'bg-green-100', 'text-green-700');
                STATUS_MSG.classList.add('bg-red-100', 'text-red-700');
            }
        }

        // --- Fungsi 2: Kirim data formulir ke backend ---
        async function saveConfig(event) {
            event.preventDefault(); // Mencegah form submit default

            const formData = new FormData(document.getElementById('config-form'));
            const data = {
                version: formData.get('version'),
                max_crowd_count: parseInt(formData.get('max_crowd_count')),
                resize_width: parseInt(formData.get('resize_width')),
                max_disappeared: parseInt(formData.get('max_disappeared')),
                h_entry: parseInt(formData.get('h_entry')),
                h_exit: parseInt(formData.get('h_exit')),
                v_entry: parseInt(formData.get('v_entry')),
                v_exit: parseInt(formData.get('v_exit')),
                initial_entry: parseInt(formData.get('initial_entry')),
                initial_exit: parseInt(formData.get('initial_exit'))
            };

            try {
                const response = await fetch('/api/config', { // Menggunakan rute POST baru
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });

                const result = await response.json();

                if (response.ok) {
                    STATUS_MSG.textContent = result.message;
                    STATUS_MSG.classList.remove('hidden', 'bg-red-100', 'text-red-700');
                    STATUS_MSG.classList.add('bg-green-100', 'text-green-700');
                    // Mengirim shutdown setelah simpan adalah praktik yang baik
                    // alert('Konfigurasi berhasil disimpan. Aplikasi akan dimatikan agar perubahan diterapkan.');
                    // sendShutdown(); 

                } else {
                    throw new Error(result.message || 'Gagal menyimpan konfigurasi.');
                }
            } catch (error) {
                console.error('Error saving config:', error);
                STATUS_MSG.textContent = `Gagal menyimpan: ${error.message}.`;
                STATUS_MSG.classList.remove('hidden', 'bg-green-100', 'text-green-700');
                STATUS_MSG.classList.add('bg-red-100', 'text-red-700');
            }
        }

        // --- Fungsi 3: Shutdown Aplikasi (Menggunakan rute yang sudah ada) ---
        async function sendShutdown() {
            try {
                await fetch('/shutdown', { method: 'POST' });
            } catch (error) {
                console.error('Shutdown failed:', error);
            }
        }
    </script>

    <script>
        const logos = [
            "{{url_for('static', filename='stas.png')}}",
            "{{url_for('static', filename='econique_logo.png')}}",
            "{{url_for('static', filename='telkom_logo.png')}}",
        ];

        let currentIndex = 0;

        function changeLogo() {
            const logoElement = document.getElementById('logo');
            logoElement.style.opacity = 0;

            setTimeout(() => {
                currentIndex = (currentIndex + 1) % logos.length;
                logoElement.src = logos[currentIndex];
                logoElement.style.opacity = 1;
            }, 500);
        }

        setInterval(changeLogo, 3000);
    </script>
</body>

</html>
