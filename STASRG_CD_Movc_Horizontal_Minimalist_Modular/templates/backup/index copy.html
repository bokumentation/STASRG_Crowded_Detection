<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Crowded Detection System">
    <meta name="keywords" content="crowd, detection, monitoring">
    <title>Crowded Detection</title>
    <link rel="icon" href="static/G_STAS.png" type="image/png">
    <link href="{{ url_for('static', filename='css/tailwind.min.css') }}" rel="stylesheet">
    <script src="{{ url_for('static', filename='js/chart.js') }}" defer></script>
    <script src="{{ url_for('static', filename='js/script.js') }}" defer></script>
</head>

<body class="bg-green-100 flex flex-col min-h-screen">
    <header class="bg-white shadow-md mb-4">
        <div class="container mx-auto flex justify-between items-center p-4">
            <div class="flex items-center">
                <img id="logo" src="{{ url_for('static', filename='stas.png') }}" alt="Crowded Detection Logo" class="h-10 mr-3">
            </div>
            <nav>
                <div class="ml-10 flex items-baseline space-x-4">
                    <button id="record-btn" onclick="toggleRecording()" 
                        class="rounded-xl px-3 py-2 text-sm font-medium text-white bg-gray-500 hover:bg-gray-700">
                        ▶ Mulai Merekam
                    </button>

                    <a href="/download_excel" class="rounded-xl px-3 py-2 text-sm font-medium text-blue-300 hover:bg-blue-700 hover:text-white">
                        Download Data
                    </a>
                    <button onclick="resetCount()" class="rounded-xl px-3 py-2 text-sm font-medium text-red-300 hover:bg-red-700 hover:text-white">
                        Reset Hitungan
                    </button>
                </div>
            </nav>
        </div>
    </header>

    <div class="bg-white shadow-md rounded-lg p-6 mb-4">
        <h3 class="text-xl font-semibold text-center" id="status">Status: Normal</h3>
    </div>

    <div class="flex flex-col md:flex-row gap-4 mb-4">
        <div class="bg-white shadow-md rounded-lg p-6 md:w-1/2">
            <h3 class="text-xl font-semibold text-center mb-4 text-gray-600">Live Video</h3>
            <img src="{{ url_for('video_feed') }}" alt="Live Video Feed" class="w-full max-w-xl mx-auto rounded-lg">
        </div>

        <style>
            .text-10xl {
                font-size: 20rem;
            }
        </style>
        <div class="bg-white shadow-md rounded-lg p-6 md:w-1/2 text-center">
            <h3 class="text-xl text-gray-600 font-semibold">Current's Visitor</h3>
            <p class="text-10xl font-bold text-blue-600" id="current-count">0</p>
        </div>
    </div>      

    <footer class = "bg-white p-4">
        <div class="flex flex-col md:flex-row gap-4 mb-4">
                <div class="text-center md:w-1/2">
                    <h3 class="text-xl text-gray-600 font-semibold">Entry Count</h3>
                    <p class="text-5xl font-bold text-green-600" id="entry-count">0</p>
                </div>
                <div class="text-center md:w-1/2">
                    <h3 class="text-xl text-gray-600 font-semibold">Exit Count</h3>
                    <p class="text-5xl font-bold text-red-600" id="exit-count">0</p>
                </div>
        </div>
    </footer>
    
    <script>
        async function toggleRecording() {
            const button = document.getElementById('record-btn');
            const isRecording = button.innerText.includes('Stop');
            const action = isRecording ? 'stop' : 'start';

            try {
                const response = await fetch(`/recording/toggle?action=${action}`, { method: 'POST' });
                const result = await response.json();

                if (result.success) {
                    if (action === 'start') {
                        button.innerText = '◼ Stop Merekam';
                        button.classList.remove('bg-gray-500', 'hover:bg-gray-700');
                        button.classList.add('bg-red-500', 'hover:bg-red-700');
                        document.getElementById('status').innerText = 'Status: Recording...';
                    } else {
                        button.innerText = '▶ Mulai Merekam';
                        button.classList.remove('bg-red-500', 'hover:bg-red-700');
                        button.classList.add('bg-gray-500', 'hover:bg-gray-700');
                        document.getElementById('status').innerText = 'Status: Normal';
                        alert(`Video tersimpan di: ${result.file_path}`);
                    }
                } else {
                    alert(`Gagal untuk ${action} rekaman: ${result.message}`);
                }
            } catch (error) {
                console.error('Menyalakan perekam gagal:', error);
                alert('Kesalahan saat tombol merekam.');
            }
        }
    </script>
</body> </html>
