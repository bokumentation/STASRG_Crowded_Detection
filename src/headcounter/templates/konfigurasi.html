<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Konfigurasi - Deteksi Kerumunan</title>
    <link href="{{ url_for('static', filename='css/tailwind.min.css') }}" rel="stylesheet">
    <link rel="icon" href="static/G_STAS.png" type="image/png">
    </head>

<body class="bg-gray-50 flex flex-col min-h-screen">
    <header class="bg-white shadow-md mb-4">
        <div class="container mx-auto flex justify-between items-center p-4">
            <div class="flex items-center">
                <img id="logo" src="{{ url_for('static', filename='stas.png') }}" alt="Crowded Detection Logo"
                    class="h-10 mr-3 transition-opacity duration-300">
            </div>
            <nav>
                <div class="ml-10 flex items-baseline space-x-4">
                    <a href="/"
                        class="rounded-xl px-3 py-2 text-sm font-medium text-gray-500 hover:bg-gray-100 hover:text-gray-900">
                        Kembali
                    </a>
                    <a href="/konfigurasi"
                        class="rounded-xl px-3 py-2 text-sm font-medium text-blue-600 bg-gray-100">
                        Konfigurasi
                    </a>

                    <a href="/tentang"
                        class="rounded-xl px-3 py-2 text-sm font-medium text-gray-500 hover:bg-gray-100 hover:text-gray-900">
                        Tentang
                    </a>
                </div>
            </nav>
        </div>
    </header>

    <div class="container mx-auto p-4 md:p-8 flex-grow">
        <div class="bg-white shadow-lg rounded-lg p-8">
            <h2 class="text-3xl font-bold text-gray-800 mb-6 border-b pb-2">Pengaturan Aplikasi Crowded Detection</h2>
            
            <div id="status-message" class="hidden p-3 mb-4 text-sm rounded-lg" role="alert"></div>

            <h3 class="text-xl font-semibold text-blue-600 border-b pb-1 mb-4">Pengaturan Batas Keramaian</h3>

            <form id="konfigurasi-form" class="space-y-6">
                <div>
                    <label for="trigger_value" class="block text-sm font-medium text-gray-700">
                        Nilai Batas (Trigger) Keramaian Saat Ini: <span id="current-trigger" class="font-bold text-lg text-red-500">...</span>
                    </label>
                    <p class="text-xs text-gray-500 mt-1">
                        Jika jumlah pengunjung melebihi nilai ini, status keramaian akan menjadi **Padat (Crowded)**.
                    </p>
                    <input type="number" id="trigger_value" name="trigger_value" 
                           class="mt-2 block w-full md:w-1/3 rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500 sm:text-lg p-2"
                           placeholder="Masukkan nilai baru (misal: 100)" min="1" required>
                </div>

                <div>
                    <button type="submit"
                            class="inline-flex justify-center rounded-md border border-transparent bg-blue-600 py-2 px-4 text-sm font-medium text-white shadow-sm hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2">
                        Simpan Konfigurasi
                    </button>
                </div>
            </form>

        </div>
    </div>
    <footer class="bg-white shadow-md mt-4 p-4 text-center text-gray-500 text-sm">
        &copy; 2025 STAS-RG | Telkom University
    </footer>
</body>

<script>
    // Logo cycling script (unchanged)
    const logos = [
        "{{url_for('static', filename='stas.png')}}",
        "{{url_for('static', filename='econique_logo.png')}}",
        "{{url_for('static', filename='telkom_logo.png')}}",
    ];

    let currentIndex = 0;

    function changeLogo() {
        const logoElement = document.getElementById('logo');
        if (logoElement) {
            logoElement.style.opacity = 0;
            setTimeout(() => {
                currentIndex = (currentIndex + 1) % logos.length;
                logoElement.src = logos[currentIndex];
                logoElement.style.opacity = 1;
            }, 500);
        }
    }

    setInterval(changeLogo, 3000);
    
    // --- Configuration Logic ---
    const configApiUrl = '/api/konfigurasi';
    const form = document.getElementById('konfigurasi-form');
    const triggerInput = document.getElementById('trigger_value');
    const currentTriggerSpan = document.getElementById('current-trigger');
    const statusMessage = document.getElementById('status-message');

    // Function to display status messages
    function showStatus(message, type = 'success') {
        statusMessage.textContent = message;
        statusMessage.className = `p-3 mb-4 text-sm rounded-lg ${type === 'success' ? 'bg-green-100 text-green-700' : 'bg-red-100 text-red-700'}`;
        statusMessage.classList.remove('hidden');
        setTimeout(() => {
            statusMessage.classList.add('hidden');
        }, 5000);
    }

    // 1. Fetch current configuration on load
    async function fetchConfig() {
        try {
            const response = await fetch(configApiUrl);
            if (!response.ok) throw new Error('Gagal mengambil data konfigurasi dari server.');
            
            const data = await response.json();
            currentTriggerSpan.textContent = data.trigger_keramaian;
            triggerInput.placeholder = `Nilai saat ini: ${data.trigger_keramaian}`;
            triggerInput.value = ''; // Clear input after showing placeholder
        } catch (error) {
            console.error('Error fetching configuration:', error);
            currentTriggerSpan.textContent = 'Gagal memuat';
            showStatus('Koneksi Gagal: Tidak dapat mengambil konfigurasi saat ini.', 'error');
        }
    }

    // 2. Handle form submission (POST)
    form.addEventListener('submit', async (event) => {
        event.preventDefault();
        
        const newTriggerValue = parseInt(triggerInput.value, 10);

        if (isNaN(newTriggerValue) || newTriggerValue <= 0) {
            showStatus('Input tidak valid. Masukkan angka positif.', 'error');
            return;
        }

        try {
            const response = await fetch(configApiUrl, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({ trigger_keramaian: newTriggerValue }),
            });

            const result = await response.json();

            if (response.ok) {
                // Update the displayed current value
                currentTriggerSpan.textContent = result.trigger_keramaian;
                triggerInput.value = '';
                triggerInput.placeholder = `Nilai saat ini: ${result.trigger_keramaian}`;
                showStatus(result.message, 'success');
            } else {
                showStatus(`Gagal menyimpan: ${result.error}`, 'error');
            }
        } catch (error) {
            console.error('Error submitting configuration:', error);
            showStatus('Kesalahan jaringan: Gagal terhubung ke server.', 'error');
        }
    });

    // Initialize
    document.addEventListener('DOMContentLoaded', fetchConfig);
</script>

</html>
