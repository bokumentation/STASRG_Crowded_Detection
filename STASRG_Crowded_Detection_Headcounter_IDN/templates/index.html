<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crowded Detection</title>
    <link href="{{ url_for('static', filename='css/tailwind.min.css') }}" rel="stylesheet">
    <link rel="icon" type="image/png" href="{{url_for('static', filename='logo_stasrg.png')}}">
</head>

<body class="bg-gray-200 flex flex-col min-h-screen">
    <header class="bg-white shadow-md p-4">
        <div class="container mx-auto flex justify-between items-center">
            <div><img id="logo" src="{{url_for('static', filename='stas.png')}}" alt="Logo"
                    class="h-10 transition-opacity duration-300"></div>
            <div class="flex space-x-4">
                <button onclick="resetCount()" class="text-sm text-red-500 font-semibold hover:text-red-700">
                    Reset Hitungan
                </button>
                <button onclick="downloadData()" class="text-sm text-green-500 font-semibold hover:text-green-700">
                    Download Data
                </button>
                <a href="/konfigurasi"
                    class="rounded-xl px-3 py-2 text-sm font-medium text-gray-500 hover:bg-gray-100 hover:text-gray-900">
                    Konfigurasi
                </a>
                <a href="/tentang"
                    class="rounded-xl px-3 py-2 text-sm font-medium text-gray-500 hover:bg-gray-100 hover:text-gray-900">
                    Tentang
                </a>
            </div>
        </div>
    </header>
    <div class="container mx-auto p-4 flex-grow">
        <div class="grid grid-cols-2 gap-2 mb-6">
            <div class="bg-white shadow-md rounded-lg p-8 text-center">
                <h3 class="text-gray-600 text-xl font-semibold text-center mb-4">Live Video</h3>
                <img src="{{ url_for('video_feed') }}" alt="Live Video Feed" class="w-full max-w-md mx-auto rounded-lg">
            </div>
            <div class="bg-white shadow-md rounded-lg p-8 text-center">
                <h3 class="text-gray-600 text-xl font-semibold">Pengunjung Terdeteksi Kamera</h3>
                <p class="font-bold text-blue-600 text-center" style="font-size: 200px !important;" id="current_count">0
                </p>
            </div>
        </div>
    </div>
    <div class="bg-white shadow-md rounded-lg p-4 mb-4">
        <h3 class="text-gray-600 text-xl font-semibold text-center mb-4">Status Keramaian</h3>
        <p id="crowdStatus" class="text-center text-2xl font-bold">Normal</p>
    </div>
</body>

<script>
    const logos = [
        "{{url_for('static', filename='stas.png')}}",
        "{{url_for('static', filename='telkom.png')}}",
        "{{url_for('static', filename='econique_logo.png')}}",
    ];

    let currentIndex = 0;
    function changeLogo() {
        const logoElement = document.getElementById('logo');
        logoElement.style.opacity = 0;

        setTimeout(() => {
            currentIndex = (currentIndex + 1) % logos.length;
            logoElement.src = logos[currentIndex];
            logoElement.style.opacity = 1;
        }, 500);
    }

    setInterval(changeLogo, 3000);
</script>

<script>
    function updateCrowdStatus() {
        fetch('/crowd_status')
            .then(response => response.json())
            .then(data => {
                let statusElement = document.getElementById('crowdStatus');
                statusElement.innerText = data.status;
                if (data.status === 'Normal') {
                    statusElement.style.color = "green";
                } else {
                    statusElement.style.color = "red";
                }
            })
            .catch(error => console.error('Error fetching crowd status:', error));
    }
    setInterval(updateCrowdStatus, 2000);
</script>

<script>
    function updateCount() {
        fetch('/count_data')
            .then(response => response.json())
            .then(data => {
                document.getElementById("current_count").innerText = data.current_count;
                document.getElementById("total_count").innerText = data.total_count;
            });
    }

    setInterval(updateCount, 2000);

    function resetCount() {
        fetch('/reset_count', { method: 'POST' })
            .then(response => response.json())
            .then(data => {
                alert(data.message);
                updateCount();
            });
    }
</script>

<script>
    let is_downloading = false;
    function downloadData() {
        is_downloading = true;
        window.location.href = '/download_excel';
        setTimeout(() => {
            is_downloading = false;
        }, 500);
    }
</script>

</html>
