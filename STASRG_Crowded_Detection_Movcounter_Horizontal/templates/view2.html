<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Crowded Detection System">
    <meta name="keywords" content="crowd, detection, monitoring">
    <title>Crowded Detection</title>
    <link rel="icon" href="static/G_STAS.png" type="image/png">
    <link href="{{ url_for('static', filename='css/tailwind.min.css') }}" rel="stylesheet">
    <script src="{{ url_for('static', filename='js/chart.js') }}" defer></script>
    <script src="{{ url_for('static', filename='js/script.js') }}" defer></script>
    <style>
        .text-10xl {
            font-size: 15rem; 
            line-height: 1;
        }
        .text-7xl {
            font-size: 5rem;
        }
    </style>
</head>

<body class="bg-green-100 flex flex-col min-h-screen">
    <header class="bg-white shadow-md mb-4">
        <div class="container mx-auto flex justify-between items-center p-4">
            <div class="flex items-center">
                <img id="logo" src="{{ url_for('static', filename='stas.png') }}" alt="Crowded Detection Logo"
                    class="h-10 mr-3">
            </div>
            <nav>
                <div class="ml-10 flex items-baseline space-x-4">
                    <button onclick="downloadDataAjax()"
                        class="rounded-xl px-3 py-2 text-sm font-medium text-blue-300 hover:bg-blue-700 hover:text-white">
                        Download Data
                    </button>
                    <button onclick="resetCount()"
                        class="rounded-xl px-3 py-2 text-sm font-medium text-red-300 hover:bg-red-700 hover:text-white">
                        Reset Hitungan
                    </button>
                </div>
            </nav>
        </div>
    </header>

    <div class="container mx-auto">
        <div class="bg-white shadow-md rounded-lg p-4 mb-4">
            <h3 class="text-xl font-semibold text-center" id="status">Status: Normal</h3>
        </div>
    </div>

    <main class="container mx-auto flex flex-col md:flex-row gap-4 mb-4 flex-grow">
        
        <div class="bg-white shadow-md rounded-lg p-6 md:w-3/5 lg:w-2/3">
            <h3 class="text-xl font-semibold text-center mb-4 text-gray-600">Live Video</h3>
            <img src="{{ url_for('video_feed') }}" alt="Live Video Feed" class="w-full h-auto rounded-lg">
        </div>

        <div class="md:w-2/5 lg:w-1/3 flex flex-col gap-4">

            <div class="bg-white shadow-md rounded-lg p-4">
                <!-- <h3 class="text-xl font-semibold text-center mb-2 text-gray-600">Data Keluar Masuk Pengunjung</h3> -->
                <div class="flex gap-4">
                    <div class="text-center w-1/2">
                        <h4 class="text-lg text-gray-600 font-semibold">Masuk</h4>
                        <p class="text-7xl font-bold text-green-600" id="entry-count">0</p>
                    </div>
                    <div class="text-center w-1/2">
                        <h4 class="text-lg text-gray-600 font-semibold">Keluar</h4>
                        <p class="text-7xl font-bold text-red-600" id="exit-count">0</p>
                    </div>
                </div>
            </div>
            
            <div class="bg-white shadow-md rounded-lg p-6 text-center flex-grow flex flex-col justify-center items-center">
                <h3 class="text-xl text-gray-600 font-semibold">Pengunjung Saat Ini</h3>
                <p class="text-10xl font-bold text-blue-600" id="current-count">0</p>
            </div>
            
        </div>
    </main>

    <!-- Count -->
    <footer class="bg-white p-4">
        <div class="flex flex-col md:flex-row gap-4 mb-4">
        </div>
    </footer>

    <script>
        function sendShutdownSignal() {
            navigator.sendBeacon('/shutdown', new URLSearchParams());
        }

        window.addEventListener('beforeunload', sendShutdownSignal);

    </script>

</body>

</html>
